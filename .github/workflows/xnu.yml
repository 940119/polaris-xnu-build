name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      runner:
        description: runner label; macos-14 is being retired on 2026-11-02
          and fails during its brownout windows (UTC 14:00-24:00)
        default: macos-15
      macho_probe:
        description: also compile a minimal userland arm64 Mach-O and print its load commands (5-c2 gate)
        default: "false"

env:
  PATCH_REPO: https://github.com/940119/ios16_on_polaris_mix2s
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    # macos-14 is retired on 2026-11-02 and is browned out every day from
    # 14:00 to 24:00 UTC until then, so the default is macos-15. That image
    # has no Xcode 15 (16.0 is the oldest), and Xcode 16's iig emits
    # IORPC.kernelContent, which xnu-8796 does not have; the runner input
    # exists so the image can be switched without editing this file.
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 120
    steps:
      # 5-c2 gate, at the TOP of the build job on purpose: a separate job sat
      # in the runner queue and was cancelled, while this job gets a machine
      # immediately. Guarded by an input; when it is on the job ENDS here on
      # purpose, so the Mach-O facts are in the log within minutes instead of
      # after a full kernel build.
      - name: Mach-O probe (5-c2 gate)
        if: ${{ inputs.macho_probe == 'true' }}
        run: |
          xcrun clang --version || true
          echo "--- iphoneos sdk ---"; xcrun --sdk iphoneos --show-sdk-path || echo "(none)"
          cat > /tmp/p.s <<'ASM'
          .globl _start
          .p2align 2
          _start:
              mov  x0, #0
              mov  x16, #1
              svc  #0x80
          ASM
          echo "=== attempt 1: -target arm64-apple-ios11.0 ==="
          if xcrun clang -target arm64-apple-ios11.0 -nostdlib -static -Wl,-e,_start -o /tmp/probe /tmp/p.s; then
            echo "OK attempt 1"
          else
            echo "=== attempt 2: -arch arm64 ==="
            xcrun clang -arch arm64 -nostdlib -static -Wl,-e,_start -o /tmp/probe /tmp/p.s && echo "OK attempt 2"
          fi
          echo "=== file ==="; file /tmp/probe || true
          echo "=== lipo ==="; lipo -info /tmp/probe || true
          echo "=== otool -h ==="; otool -h /tmp/probe || true
          echo "=== load commands ==="; otool -l /tmp/probe | grep -E "cmd |platform|minos|sdk |name |entryoff|segname|fileoff" | head -40 || true
          echo "=== size ==="; ls -l /tmp/probe || true
      - name: Stop after the probe
        if: ${{ inputs.macho_probe == 'true' }}
        run: |
          echo "PROBE DONE -- failing on purpose so this run ends here."
          exit 1
      - uses: actions/checkout@v4

      # The patches live where they are written; this repository only builds.
      - name: Fetch patches
        run: |
          git clone -q --depth 1 -b mi8gpu "$PATCH_REPO" src
          echo "patches: $(ls src/xnu/patches/*.patch | wc -l | tr -d ' ') files, last:"
          ls src/xnu/patches | tail -3
          shasum -a 256 src/xnu/patches/0117-*.patch src/xnu/patches/0118-*.patch 2>/dev/null || true

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp src/xnu/patches/*.patch src/xnu/patches/*.sh dxb/patches/
          # bearssl.org has been answering 502, so 0020 prefers a frozen tree over
          # the clone.  It looks beside itself, i.e. dxb/vendor, so put it there.
          if [ -d src/xnu/vendor ]; then
            cp -R src/xnu/vendor dxb/vendor
            ls -l dxb/vendor
          else
            echo "no src/xnu/vendor, 0020 will clone bearssl"
          fi
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled)
          sudo mkdir -p /usr/local/bin
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          # the oldest installed Xcode, which is the closest to Xcode 15
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig
          iig -v || true

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            [ -e "$lib" ] || continue
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          # kernel.release.sweet.link/ holds the 123 MB static archive and the
          # dSYM, which together are most of the 54 MB artifact. Nothing here
          # ever links locally - every build happens in CI - so dropping them
          # takes the download from half an hour to about a minute.
          # macOS find has no -maxdepth, so this is a glob rather than a search.
          rm -rf out/*.link 2>/dev/null || true
          du -sh out
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
